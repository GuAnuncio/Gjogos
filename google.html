


<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efekta - GJogos</title>
    <link rel="icon" href="59084.ico">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #202020;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        header h2 {
            font-size: 17px;
            white-space: nowrap;
        }

        form {
            flex: 1;
            display: flex;
            gap: 6px;
            min-width: 200px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 5px;
            background: #303030;
            color: white;
            font-size: 14px;
        }

        button {
            padding: 10px 13px;
            border: none;
            border-radius: 5px;
            background: #4285f4;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #2865c7;
        }

        #fullscreen {
            background: #444;
        }

        iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: white;
        }

        #container:fullscreen {
            width: 100%;
            height: 100%;
        }

        #aviso {
            background: #202020;
            color: #ccc;
            text-align: center;
            padding: 6px;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            header h2 {
                width: 100%;
            }
        }
    </style>
</head>

<body>
<div id="container">

    <header>
        <h2>Efekta | GJogos</h2>

        <form id="searchForm">
            <input
                type="text"
                id="url"
                placeholder="Digite um site ou endereço..."
                value="https://learn.better.efekta.com/gap/ui/home?domain_hint=goias"
                required
            >
            <button type="submit">Abrir</button>
        </form>

        <button id="fullscreen" onclick="telaCheia()">
            ⛶ Tela cheia
        </button>
    </header>

    <iframe
        id="pagina"
        src="https://learn.better.efekta.com/gap/ui/home?domain_hint=goias"
        title="Plataforma Efekta"
        allow="fullscreen"
    ></iframe>

    <div id="aviso">
        Se o site não abrir aqui, tente o botão Abrir em nova aba.
        Alguns sites bloqueiam iframes.
        <button onclick="novaAba()">Abrir em nova aba</button>
    </div>

</div>

<script>
    const campo = document.getElementById("url");
    const pagina = document.getElementById("pagina");

    function obterEndereco(texto) {
        texto = texto.trim();

        if (!texto) return null;

        // Pesquisas são abertas no Google.
        if (texto.includes(" ")) {
            return "https://www.google.com/search?q="
                + encodeURIComponent(texto);
        }

        if (!/^https?:\/\//i.test(texto)) {
            texto = "https://" + texto;
        }

        try {
            const endereco = new URL(texto);

            if (!["http:", "https:"].includes(endereco.protocol)) {
                return null;
            }

            return endereco.href;
        } catch {
            return null;
        }
    }

    document.getElementById("searchForm")
        .addEventListener("submit", function(event) {
            event.preventDefault();

            const endereco = obterEndereco(campo.value);

            if (!endereco) {
                alert("Digite um endereço válido.");
                return;
            }

            campo.value = endereco;
            pagina.src = endereco;
        });

    function telaCheia() {
        const container = document.getElementById("container");

        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(() => {
                alert("Não foi possível ativar a tela cheia.");
            });
        } else {
            document.exitFullscreen();
        }
    }

    function novaAba() {
        const endereco = obterEndereco(campo.value);

        if (endereco) {
            window.open(endereco, "_blank", "noopener,noreferrer");
        }
    }
</script>
</body>
</html>
