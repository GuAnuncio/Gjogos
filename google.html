

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Google - GJogos</title>
    <link rel="icon" href="59084.ico">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #toolbar {
            height: 48px;
            min-height: 48px;
            background: #202020;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
        }

        #toolbar h1 {
            font-size: 17px;
            font-weight: normal;
        }

        #toolbar button {
            border: none;
            color: white;
            background: #383838;
            padding: 9px 13px;
            border-radius: 5px;
            cursor: pointer;
        }

        #toolbar button:hover {
            background: #505050;
        }

        #browser {
            width: 100%;
            flex: 1;
            border: none;
            background: white;
        }

        #game-container:fullscreen {
            width: 100%;
            height: 100%;
        }

        #game-container:fullscreen #toolbar {
            height: 42px;
            min-height: 42px;
        }

        #message {
            padding: 8px;
            background: #202020;
            text-align: center;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div id="game-container">

    <div id="toolbar">
        <h1>Google | GJogos</h1>

        <button onclick="toggleFullscreen()">
            ⛶ Tela cheia
        </button>
    </div>

    <iframe
        id="browser"
        src="https://www.google.com/webhp?igu=1"
        title="Google"
        allow="fullscreen"
    ></iframe>

    <div id="message">
        Algumas páginas podem bloquear a exibição dentro deste quadro.
    </div>

</div>

<script>
    function toggleFullscreen() {
        const container = document.getElementById("game-container");

        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(() => {
                alert("Não foi possível ativar a tela cheia.");
            });
        } else {
            document.exitFullscreen();
        }
    }
</script>

</body>
</html>
