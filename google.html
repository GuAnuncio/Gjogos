



<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google - GJogos</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #111;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#container {
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
}

header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: #202020;
}

header h2 {
    color: white;
    font-size: 17px;
    white-space: nowrap;
}

form {
    flex: 1;
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 11px;
    border: 1px solid #555;
    border-radius: 5px;
    background: #303030;
    color: white;
    font-size: 15px;
}

button {
    padding: 10px 14px;
    border: none;
    border-radius: 5px;
    color: white;
    background: #4285f4;
    cursor: pointer;
}

#fullscreen {
    background: #444;
}

iframe {
    flex: 1;
    width: 100%;
    border: none;
    background: white;
}

#container:fullscreen {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>
<div id="container">

<header>
    <h2>Google | GJogos</h2>

    <form id="searchForm">
        <input
            id="search"
            type="text"
            placeholder="Pesquisar no Google ou digitar endereço..."
            autocomplete="off"
        >
        <button type="submit">Pesquisar</button>
    </form>

    <button id="fullscreen" onclick="toggleFullscreen()">
        ⛶ Tela cheia
    </button>
</header>

<iframe
    id="page"
    src="https://www.google.com/webhp?igu=1"
    title="Google"
    allow="fullscreen">
</iframe>

</div>

<script>
const search = document.getElementById("search");
const page = document.getElementById("page");

document.getElementById("searchForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const value = search.value.trim();
    if (!value) return;

    let url;

    if (/^https?:\/\//i.test(value)) {
        url = value;
    } else if (value.includes(".") && !value.includes(" ")) {
        url = "https://" + value;
    } else {
        url = "https://www.google.com/search?q=" + encodeURIComponent(value);
    }

    page.src = url;
});

function toggleFullscreen() {
    const container = document.getElementById("container");

    if (!document.fullscreenElement) {
        container.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen();
    }
}
</script>
</body>
</html>
