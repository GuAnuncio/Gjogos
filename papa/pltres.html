<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Papa's louie 2 - GJogos</title>

    <link rel="icon" href="../59084.ico" type="image/x-icon">

    <!-- Configuração do Ruffle -->
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            autoplay: "on",
            splashScreen: false,
            backgroundColor: "#111111"
        };
    </script>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2563eb, #93c5fd);
            min-height: 100vh;
            color: white;
        }

        header {
            background: rgba(0, 0, 0, 0.25);
            padding: 18px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 6px 0 0;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin: 25px auto;
        }

        .botoes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .botao {
            display: inline-block;
            padding: 10px 18px;
            background: white;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .botao:hover {
            transform: scale(1.04);
        }

        .jogo {
            background: white;
            padding: 12px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        #jogo {
            width: 100%;
            height: 700px;
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        #jogo ruffle-player {
            display: block;
            width: 100%;
            height: 100%;
        }

        #mensagem {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            text-align: center;
            color: white;
            font-size: 17px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        footer {
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            #jogo {
                height: 450px;
            }
        }

        #areaJogo:fullscreen {
            width: 100%;
            height: 100%;
            padding: 0;
            background: #111;
        }

        #areaJogo:fullscreen #jogo {
            height: 100%;
            border-radius: 0;
        }
    </style>
</head>

<body>

    <header>
        <h1>Papa's louie 2</h1>
        <p>Jogue no GJogos</p>
    </header>

    <main class="container">

        <div class="botoes">
            <a class="botao" href="../index.html">
                ← Voltar
            </a>

            <button class="botao" id="botaoTelaCheia">
                ⛶ Tela cheia
            </button>
        </div>

        <div class="jogo" id="areaJogo">
            <div id="jogo">
                <div id="mensagem">
                    Carregando o jogo...
                </div>
            </div>
        </div>

    </main>

    <footer>
        <p>GJogos - Jogos Online</p>
    </footer>

    <script>
        const areaJogo = document.getElementById("areaJogo");
        const elementoJogo = document.getElementById("jogo");
        const mensagem = document.getElementById("mensagem");

        function mostrarErro(texto) {
            mensagem.style.display = "flex";
            mensagem.textContent = texto;
        }

        async function carregarJogo() {
            try {
                if (!window.RufflePlayer ||
                    !window.RufflePlayer.newest) {
                    throw new Error(
                        "O Ruffle não foi carregado. Verifique sua conexão."
                    );
                }

                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();

                player.style.width = "100%";
                player.style.height = "100%";

                elementoJogo.appendChild(player);

                // O arquivo SWF deve estar nesta mesma pasta.
                await player.load("../papa arquivos/PapaLouie3.swf");

                mensagem.style.display = "none";

            } catch (erro) {
                console.error("Erro ao carregar o jogo:", erro);

                mostrarErro(
                    "Não foi possível carregar o jogo. " +
                    "Confira se fum.swf está na pasta correta " +
                    "e se o arquivo é um SWF válido. " +
                    "Abra o Console do navegador (F12) para ver o erro."
                );
            }
        }

        document.getElementById("botaoTelaCheia")
            .addEventListener("click", async function () {
                try {
                    if (!document.fullscreenElement) {
                        await areaJogo.requestFullscreen();
                    } else {
                        await document.exitFullscreen();
                    }
                } catch (erro) {
                    console.error(
                        "Erro ao abrir tela cheia:",
                        erro
                    );
                }
            });

        carregarJogo();
    </script>

</body>
</html>
