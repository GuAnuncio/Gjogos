<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Papa's Pizzeria - GJogos</title>

    <!-- Ruffle: executa o jogo Flash no navegador -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2563eb, #93c5fd);
            min-height: 100vh;
            color: white;
        }

        header {
            background: rgba(0, 0, 0, 0.25);
            padding: 18px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 6px 0 0;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin: 25px auto;
        }

        .voltar {
            display: inline-block;
            padding: 10px 18px;
            margin-bottom: 15px;
            background: white;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
            border-radius: 10px;
            transition: 0.2s;
        }

        .voltar:hover {
            transform: scale(1.05);
        }

        .jogo {
            background: white;
            padding: 12px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        #jogo {
            width: 100%;
            min-height: 700px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            border-radius: 10px;
            overflow: hidden;
        }

        ruffle-player {
            width: 100%;
            height: 700px;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>

    <header>
        <h1>🍕 Papa's Pizzeria</h1>
        <p>Jogue no GJogos</p>
    </header>

    <main class="container">

        <a class="voltar" href="index.html">
            ← Voltar para o GJogos
        </a>

        <div class="jogo">
            <div id="jogo"></div>
        </div>

    </main>

    <footer>
        <p>GJogos - Jogos Online</p>
    </footer>


    <script>
        window.RufflePlayer = window.RufflePlayer || {};

        window.addEventListener("load", function () {

            const ruffle = window.RufflePlayer.newest();

            const player = ruffle.createPlayer();

            player.style.width = "100%";
            player.style.height = "700px";

            document.getElementById("jogo").appendChild(player);

            player.load("papaspizzeria_v2.swf");

        });
    </script>

</body>

</html>
