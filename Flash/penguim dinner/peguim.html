<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Papa's Pizzeria - GJogos</title>

    <!-- Ícone do GJogos -->
    <link rel="icon" href="../../59084.ico" type="image/x-icon">

    <!-- Ruffle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2563eb, #93c5fd);
            min-height: 100vh;
            color: white;
        }

        header {
            background: rgba(0, 0, 0, 0.25);
            padding: 18px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 6px 0 0;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin: 25px auto;
        }

        .botoes {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .botao {
            padding: 10px 18px;
            background: white;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .botao:hover {
            transform: scale(1.05);
        }

        .jogo {
            background: white;
            padding: 12px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        #jogo {
            width: 100%;
            height: 700px;
            background: #111;
            border-radius: 10px;
            overflow: hidden;
        }

        ruffle-player {
            width: 100%;
            height: 100%;
        }

        footer {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Penguim diner</h1>
        <p>Jogue no GJogos</p>
    </header>

    <main class="container">

        <div class="botoes">

            <a class="botao" href="../../index.html">
                ← Voltar
            </a>

            <button class="botao" onclick="telaCheia()">
                ⛶ Tela cheia
            </button>

        </div>

        <div class="jogo" id="areaJogo">
            <div id="jogo"></div>
        </div>

    </main>

    <footer>
        <p>GJogos - Jogos Online</p>
    </footer>


    <script>

        /* Cria o jogador Ruffle */
        window.RufflePlayer = window.RufflePlayer || {};

        window.addEventListener("load", function () {

            const ruffle = window.RufflePlayer.newest();

            const player = ruffle.createPlayer();

            player.style.width = "100%";
            player.style.height = "100%";

            document.getElementById("jogo").appendChild(player);

            player.load("penguin-diner-801.swf");

        });


        /* Botão de tela cheia */
        function telaCheia() {

            const area = document.getElementById("areaJogo");

            if (!document.fullscreenElement) {

                area.requestFullscreen();

            } else {

                document.exitFullscreen();

            }

        }

    </script>

</body>

</html>
